name: Validate agent kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror canonical skills to Claude
        run: python3 scripts/sync_skills.py

      - name: Build deterministic agentic asset index
        run: python3 scripts/build_asset_index.py --output /tmp/agentic-assets.json

      - name: Validate framework structure and parity
        run: python3 scripts/validate_repo.py

      - name: Validate skill eval fixtures
        run: python3 scripts/validate_evals.py

      - name: Assert generated mirrors are committed
        run: git diff --exit-code
